{% extends 'base_cliente.html' %}
{% block titulito %}Restablecer Contraseña{% endblock %}

{% block contenido %}
<div class="row justify-content-center py-4 px-3">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow border-0 rounded-4">

      <div class="card-header bg-success text-white text-center py-3 rounded-top-4">
        <h4 class="mb-0 fs-5 fw-normal">Crear Nueva Contraseña</h4>
      </div>

      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label for="nueva" class="form-label">Nueva Contraseña</label>
            <input type="password" name="nueva" id="nueva"
                   class="form-control form-control-lg" required
                   autocomplete="new-password">
            <div class="form-text">Mínimo 6 caracteres</div>
          </div>

          <div class="mb-4">
            <label for="confirmar" class="form-label">Confirmar Contraseña</label>
            <input type="password" name="confirmar" id="confirmar"
                   class="form-control form-control-lg" required
                   autocomplete="new-password">
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">
              Restablecer
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
