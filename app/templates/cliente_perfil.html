{% extends 'base_cliente.html' %}
{% block titulito %}Mi Perfil - Cliente{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow border-0 rounded-3 overflow-hidden">
            <div class="card-header bg-primary text-white py-3 py-md-4">
                <h4 class="mb-0 fs-5 fs-md-4">
                    <i class="fas fa-user-circle me-2"></i> Mi Perfil
                </h4>
            </div>
            <div class="card-body p-3 p-md-4">
                <form method="POST" action="{{ url_for('cliente_actualizar_perfil') }}">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label">Nombres</label>
                            <input type="text" name="nombres" class="form-control" value="{{ cliente.nombres }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Apellidos</label>
                            <input type="text" name="apellidos" class="form-control" value="{{ cliente.apellidos }}" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" value="{{ cliente.email }}" required>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-12 col-md-6">
                            <label class="form-label">DNI</label>
                            <input type="text" name="dni" class="form-control" value="{{ cliente.dni or '' }}" maxlength="8">
                            <small class="text-muted d-block">Opcional, máximo 8 dígitos</small>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono or '' }}">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Dirección</label>
                        <textarea name="direccion" class="form-control" rows="3">{{ cliente.direccion or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between gap-2 mt-4">
                        <a href="{{ url_for('catalogo_cliente') }}" class="btn btn-secondary flex-fill py-2">
                            <i class="fas fa-arrow-left me-2"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-primary flex-fill py-2">
                            <i class="fas fa-save me-2"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-3 shadow-sm border-0 rounded-3">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                    <div class="text-center text-sm-start">
                        <i class="fas fa-key text-warning me-2"></i>
                        <strong>Seguridad:</strong> Cambia tu contraseña regularmente
                    </div>
                    <a href="{{ url_for('cliente_cambiar_contrasena') }}" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-key me-1"></i> Cambiar Contraseña
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Responsive */
    @media (max-width: 576px) {
        .card-header {
            padding: 0.75rem !important;
        }
        .card-header h4 {
            font-size: 1rem !important;
        }
        .card-body {
            padding: 1rem !important;
        }
        .form-label {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }
        .form-control {
            font-size: 0.8rem;
            padding: 0.4rem 0.6rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 0.4rem 0.6rem;
        }
        .text-muted {
            font-size: 0.65rem;
        }
    }
    
    @media (min-width: 577px) and (max-width: 768px) {
        .card-body {
            padding: 1.25rem !important;
        }
    }
</style>
{% endblock %}
