<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Librería Salesiana</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        /* ===== FONDO OSCURO CON ESTRELLAS ===== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            z-index: 99999;
        }

        /* ===== ESTRELLAS CON CSS PURO ===== */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .stars-container::before,
        .stars-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 30% 70%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.9), transparent),
                radial-gradient(3px 3px at 70% 40%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 90% 80%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 15% 45%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 45% 90%, rgba(255,255,255,0.7), transparent),
                radial-gradient(3px 3px at 85% 15%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 5% 60%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 60% 55%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 35% 35%, rgba(255,215,0,0.7), transparent),
                radial-gradient(2px 2px at 75% 75%, rgba(255,215,0,0.6), transparent),
                radial-gradient(1px 1px at 95% 45%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 25% 85%, rgba(255,255,255,0.7), transparent),
                radial-gradient(3px 3px at 55% 15%, rgba(255,215,0,0.5), transparent),
                radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 20% 10%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 65% 95%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 40% 50%, rgba(255,215,0,0.7), transparent),
                radial-gradient(1px 1px at 88% 25%, rgba(255,255,255,0.9), transparent);
            background-size: 200px 200px;
            background-repeat: repeat;
        }

        .stars-container::after {
            background-image: 
                radial-gradient(1px 1px at 12% 33%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 48% 77%, rgba(255,255,255,0.6), transparent),
                radial-gradient(3px 3px at 68% 12%, rgba(255,215,0,0.5), transparent),
                radial-gradient(1px 1px at 92% 62%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 32% 48%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 76% 88%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 16% 72%, rgba(255,215,0,0.6), transparent),
                radial-gradient(1px 1px at 56% 28%, rgba(255,255,255,0.9), transparent),
                radial-gradient(3px 3px at 84% 52%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 44% 6%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 8% 92%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 72% 38%, rgba(255,215,0,0.6), transparent),
                radial-gradient(2px 2px at 28% 18%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 96% 8%, rgba(255,255,255,0.8), transparent),
                radial-gradient(3px 3px at 52% 62%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 18% 54%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 64% 82%, rgba(255,215,0,0.6), transparent),
                radial-gradient(1px 1px at 38% 40%, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 88% 68%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 4% 80%, rgba(255,255,255,0.9), transparent);
            background-size: 180px 180px;
            background-repeat: repeat;
            opacity: 0.7;
            animation: twinkleStars 3s ease-in-out infinite alternate;
        }

        @keyframes twinkleStars {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* ===== VÍA LÁCTEA ===== */
        .milky-way {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(100, 100, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 30%, rgba(200, 150, 255, 0.03) 0%, transparent 40%),
                        radial-gradient(ellipse at 50% 70%, rgba(100, 200, 255, 0.03) 0%, transparent 40%);
            z-index: 0;
            animation: rotateGalaxy 60s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-content {
            text-align: center;
            color: white;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo-ring {
            width: 120px;
            height: 120px;
            border: 4px solid #FFD700;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            position: relative;
            animation: spinSlow 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2), inset 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.1);
            animation: spinSlow 8s linear infinite reverse;
        }

        .logo-ring i {
            font-size: 3.5rem;
            color: #FFD700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }

        .logo-title {
            color: #FFFFFF;
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            margin: 0;
            letter-spacing: 3px;
        }

        .logo-subtitle {
            color: #FFD700;
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .progress-section {
            max-width: 400px;
            margin: 0 auto 25px auto;
        }

        .progress-label {
            color: #FFFFFF;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            opacity: 0.9;
        }

        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            height: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA000);
            width: 0%;
            border-radius: 25px;
            transition: width 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-percent {
            color: #FFD700;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .dots-container {
            margin: 25px 0;
        }

        .loading-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #FFD700;
            border-radius: 50%;
            margin: 0 7px;
            animation: bounceDot 1.4s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .dot-delay-1 { animation-delay: 0.2s; }
        .dot-delay-2 { animation-delay: 0.4s; }

        .countdown-number {
            display: inline-block;
            font-size: 3rem;
            font-weight: 900;
            color: #FFD700;
            min-width: 60px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
            animation: pulseCount 1s ease-in-out infinite alternate;
        }

        .countdown-label {
            color: #FFFFFF;
            font-size: 1.2rem;
            font-weight: 500;
            margin-left: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            opacity: 0.7;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
            40% { transform: scale(1.3); opacity: 1; }
        }

        @keyframes pulseCount {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        @media (max-width: 576px) {
            .logo-ring { width: 90px; height: 90px; }
            .logo-ring i { font-size: 2.5rem; }
            .logo-title { font-size: 2rem; }
            .logo-subtitle { font-size: 0.95rem; }
            .countdown-number { font-size: 2.2rem; }
            .loading-dot { width: 10px; height: 10px; margin: 0 5px; }
            .progress-section { max-width: 280px; }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="milky-way"></div>
        <div class="stars-container"></div>

        <div class="loading-content">
            <div class="logo-ring">
                <i class="fas fa-book-open"></i>
            </div>
            <h1 class="logo-title">Salesiana</h1>
            <p class="logo-subtitle">Librería Don Bosco</p>

            <div class="progress-section">
                <div class="progress-label">
                    <span id="progressText">Inicializando sistema...</span>
                </div>
                <div class="progress-bar-wrapper">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-percent" id="progressPercent">0%</div>
            </div>

            <div class="dots-container">
                <span class="loading-dot"></span>
                <span class="loading-dot dot-delay-1"></span>
                <span class="loading-dot dot-delay-2"></span>
            </div>

            <div>
                <span class="countdown-number" id="countdownNum">3</span>
                <span class="countdown-label">s</span>
            </div>
        </div>
    </div>

    <script>
        // ===== SILENCIAR ERRORES DE PERMISOS =====
        window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && e.reason.code === 403) {
                e.preventDefault();
                return true;
            }
            if (e.reason && e.reason.message && (
                e.reason.message.includes('permission error') ||
                e.reason.message.includes('permission denied') ||
                e.reason.message.includes('not authorized')
            )) {
                e.preventDefault();
                return true;
            }
        });

        const originalConsoleError = console.error;
        console.error = function() {
            const args = Array.from(arguments);
            const msg = args.join(' ');
            if (msg.includes('permission error') ||
                msg.includes('403') ||
                msg.includes('not authorized') ||
                msg.includes('permission denied')) {
                return;
            }
            originalConsoleError.apply(console, arguments);
        };

        // ===== PROGRESO Y CONTADOR =====
        (function() {
            'use strict';

            function initLoading() {
                try {
                    const progressFill = document.getElementById('progressFill');
                    const progressPercent = document.getElementById('progressPercent');
                    const progressText = document.getElementById('progressText');
                    const countdownNum = document.getElementById('countdownNum');

                    if (!progressFill || !progressPercent || !progressText || !countdownNum) {
                        return;
                    }

                    let progress = 0;
                    let countdown = 3;
                    let phase = 0;
                    let progressInterval = null;
                    let countdownInterval = null;

                    const messages = [
                        'Cargando módulos...',
                        'Conectando base de datos...',
                        'Inicializando ventas...',
                        '¡Listo! 🙏'
                    ];

                    function clearIntervals() {
                        if (progressInterval) clearInterval(progressInterval);
                        if (countdownInterval) clearInterval(countdownInterval);
                    }

                    progressInterval = setInterval(() => {
                        try {
                            let increment;
                            if (progress < 30) increment = 3 + Math.random() * 5;
                            else if (progress < 70) increment = 2 + Math.random() * 3;
                            else increment = 1 + Math.random() * 2;

                            progress = Math.min(progress + increment, 100);

                            progressFill.style.width = progress + '%';
                            progressPercent.textContent = Math.floor(progress) + '%';

                            const phaseIndex = Math.floor(progress / 33);
                            if (phaseIndex > phase && phaseIndex < 3) {
                                phase = phaseIndex;
                                progressText.textContent = messages[phase];
                            }

                            if (progress >= 100) {
                                progressFill.style.width = '100%';
                                progressText.textContent = messages[3];
                                clearInterval(progressInterval);
                            }
                        } catch (e) {}
                    }, 150);

                    countdownInterval = setInterval(() => {
                        try {
                            countdown--;
                            countdownNum.textContent = countdown;

                            countdownNum.style.transform = 'scale(0.8)';
                            setTimeout(() => {
                                countdownNum.style.transform = 'scale(1)';
                            }, 150);

                            if (countdown <= 0) {
                                clearIntervals();
                                const screen = document.getElementById('loadingScreen');
                                if (screen) {
                                    screen.style.transition = 'opacity 0.6s ease';
                                    screen.style.opacity = '0';
                                }
                                setTimeout(() => {
                                    window.location.href = '/catalogo';
                                }, 500);
                            }
                        } catch (e) {}
                    }, 1000);

                    setTimeout(() => {
                        try {
                            if (countdown > 0) {
                                window.location.href = '/catalogo';
                            }
                        } catch (e) {}
                    }, 8000);

                    window.addEventListener('beforeunload', clearIntervals);
                } catch (e) {
                    setTimeout(() => {
                        window.location.href = '/catalogo';
                    }, 3000);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initLoading);
            } else {
                initLoading();
            }
        })();
    </script>

    <noscript>
        <meta http-equiv="refresh" content="3;url=/catalogo">
    </noscript>
</body>
</html>
